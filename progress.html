<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading Bar Preview - Optimized</title>
  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --value: 68%;
      --page-bg: #000;
      --phone-bg: #0b1e4a;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--page-bg);
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .choice {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
      width: 100vw;
      height: 100vh;
      padding: 24px;
    }

    .phone {
      position: relative;
      width: auto;
      height: min(92vh, 920px);
      max-width: calc(100vw - 168px);
      aspect-ratio: 920 / 2048;
      overflow: hidden;
      border-radius: clamp(22px, 3vw, 38px);
      background: var(--phone-bg);
      box-shadow:
        0 0 0 2px rgba(168, 238, 255, .18),
        0 0 0 10px rgba(4, 13, 28, .96),
        0 24px 54px rgba(47, 156, 255, .16);
      isolation: isolate;
    }

    .phone::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(255,255,255,.04), transparent 30%),
        linear-gradient(0deg, rgba(214,246,255,.10), transparent 22%);
      pointer-events: none;
      z-index: 2;
    }

    .loading-art {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .bars {
      position: absolute;
      left: 9.5%;
      right: 9.5%;
      bottom: 7.1%;
      height: 7%;
      z-index: 3;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .bar {
      position: absolute;
      width: 100%;
      opacity: 0;
      transform: translateY(8px) scale(.98);
      transition: opacity .18s ease, transform .18s ease;
    }

    #bar-1:checked ~ .stage .variant-1,
    #bar-2:checked ~ .stage .variant-2,
    #bar-3:checked ~ .stage .variant-3,
    #bar-4:checked ~ .stage .variant-4,
    #bar-5:checked ~ .stage .variant-5,
    #bar-6:checked ~ .stage .variant-6,
    #bar-7:checked ~ .stage .variant-7,
    #bar-8:checked ~ .stage .variant-8,
    #bar-9:checked ~ .stage .variant-9,
    #bar-10:checked ~ .stage .variant-10,
    #bar-11:checked ~ .stage .variant-11,
    #bar-12:checked ~ .stage .variant-12,
    #bar-13:checked ~ .stage .variant-13,
    #bar-14:checked ~ .stage .variant-14,
    #bar-15:checked ~ .stage .variant-15,
    #bar-16:checked ~ .stage .variant-16,
    #bar-17:checked ~ .stage .variant-17,
    #bar-18:checked ~ .stage .variant-18,
    #bar-19:checked ~ .stage .variant-19,
    #bar-20:checked ~ .stage .variant-20 {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .controls {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
      z-index: 5;
    }

    .pick {
      --mini-a: #e7fbff;
      --mini-b: #45cfff;
      --mini-glow: rgba(83, 216, 255, .36);
      position: relative;
      width: 46px;
      height: 20px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(6, 18, 44, .82);
      cursor: pointer;
      box-shadow: inset 0 0 8px rgba(255,255,255,.06);
      transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
    }

    .pick::before {
      content: "";
      position: absolute;
      left: 7px;
      right: 7px;
      top: 50%;
      height: 8px;
      border-radius: 999px;
      transform: translateY(-50%);
      background:
        linear-gradient(180deg, rgba(255,255,255,.44), transparent 52%),
        linear-gradient(90deg, var(--mini-a), var(--mini-b) 66%, rgba(255,255,255,.12) 66%);
      box-shadow: 0 0 7px var(--mini-glow);
    }

    .pick::after {
      content: "";
      position: absolute;
      top: 50%;
      left: calc(66% + 3px);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mini-a);
      transform: translateY(-50%);
      box-shadow: 0 0 7px var(--mini-glow);
    }

    .pick:hover {
      transform: translateX(-1px);
      border-color: rgba(220, 250, 255, .56);
    }

    #bar-1:checked ~ .stage label[for="bar-1"],
    #bar-2:checked ~ .stage label[for="bar-2"],
    #bar-3:checked ~ .stage label[for="bar-3"],
    #bar-4:checked ~ .stage label[for="bar-4"],
    #bar-5:checked ~ .stage label[for="bar-5"],
    #bar-6:checked ~ .stage label[for="bar-6"],
    #bar-7:checked ~ .stage label[for="bar-7"],
    #bar-8:checked ~ .stage label[for="bar-8"],
    #bar-9:checked ~ .stage label[for="bar-9"],
    #bar-10:checked ~ .stage label[for="bar-10"],
    #bar-11:checked ~ .stage label[for="bar-11"],
    #bar-12:checked ~ .stage label[for="bar-12"],
    #bar-13:checked ~ .stage label[for="bar-13"],
    #bar-14:checked ~ .stage label[for="bar-14"],
    #bar-15:checked ~ .stage label[for="bar-15"],
    #bar-16:checked ~ .stage label[for="bar-16"],
    #bar-17:checked ~ .stage label[for="bar-17"],
    #bar-18:checked ~ .stage label[for="bar-18"],
    #bar-19:checked ~ .stage label[for="bar-19"],
    #bar-20:checked ~ .stage label[for="bar-20"] {
      border-color: rgba(255, 235, 150, .82);
      box-shadow:
        inset 0 0 9px rgba(255, 225, 132, .14),
        0 0 12px rgba(255, 219, 106, .20);
    }

    .pick:nth-child(1) { --mini-a: #e7fbff; --mini-b: #45cfff; --mini-glow: rgba(83,216,255,.42); }
    .pick:nth-child(2) { --mini-a: #fff1a8; --mini-b: #f2a730; --mini-glow: rgba(255,214,92,.42); }
    .pick:nth-child(3) { --mini-a: #deffd0; --mini-b: #4cd66e; --mini-glow: rgba(126,227,95,.38); }
    .pick:nth-child(4) { --mini-a: #ffe3a3; --mini-b: #ff7b2c; --mini-glow: rgba(255,154,61,.40); }
    .pick:nth-child(5) { --mini-a: #f0dcff; --mini-b: #9a63ff; --mini-glow: rgba(176,114,255,.40); }
    .pick:nth-child(6) { --mini-a: #ffd8f0; --mini-b: #ff5ab3; --mini-glow: rgba(255,115,198,.38); }
    .pick:nth-child(7) { --mini-a: #ffd6c9; --mini-b: #ff493f; --mini-glow: rgba(255,103,90,.36); }
    .pick:nth-child(8) { --mini-a: #d8fff7; --mini-b: #18b8d9; --mini-glow: rgba(48,214,236,.38); }
    .pick:nth-child(9) { --mini-a: #fff0a8; --mini-b: #6ed351; --mini-glow: rgba(215,232,92,.34); }
    .pick:nth-child(10) { --mini-a: #dff1ff; --mini-b: #2a83ff; --mini-glow: rgba(93,159,255,.38); }
    .pick:nth-child(11) { --mini-a: #f5ffff; --mini-b: #36c9ef; --mini-glow: rgba(78,220,255,.40); }
    .pick:nth-child(12) { --mini-a: #fff3aa; --mini-b: #ff7d37; --mini-glow: rgba(255,174,69,.38); }
    .pick:nth-child(13) { --mini-a: #e5ffd4; --mini-b: #2fbf68; --mini-glow: rgba(96,217,87,.36); }
    .pick:nth-child(14) { --mini-a: #f0dcff; --mini-b: #ec56b8; --mini-glow: rgba(230,120,255,.36); }
    .pick:nth-child(15) { --mini-a: #ffe3ce; --mini-b: #e53f45; --mini-glow: rgba(255,114,83,.36); }
    .pick:nth-child(16) { --mini-a: #eaf6ff; --mini-b: #46a5ff; --mini-glow: rgba(91,182,255,.38); }
    .pick:nth-child(17) { --mini-a: #e9ffd8; --mini-b: #8ed450; --mini-glow: rgba(168,220,93,.34); }
    .pick:nth-child(18) { --mini-a: #fff0bd; --mini-b: #f2b43e; --mini-glow: rgba(248,201,93,.36); }
    .pick:nth-child(19) { --mini-a: #f2e3ff; --mini-b: #8b77ff; --mini-glow: rgba(162,139,255,.36); }
    .pick:nth-child(20) { --mini-a: #dffef7; --mini-b: #1cb8b2; --mini-glow: rgba(56,212,199,.36); }

    /*
      Optimized progress system:
      - no filter/backdrop-filter/clip-path/color-mix;
      - no background-position animation;
      - visual depth comes from 2 gradients + small shadows;
      - optional shine uses transform only;
      - marker is attached to the track, not the fill, and sits fully inside the filled area.
    */
    .lite-bar {
      --h: clamp(20px, 3.1vw, 34px);
      --radius: 999px;
      --pad: 2px;
      --rim-a: rgba(230, 251, 255, .90);
      --rim-b: rgba(55, 198, 242, .74);
      --track-a: rgba(3, 25, 62, .88);
      --track-b: rgba(10, 53, 102, .82);
      --fill-a: #f3ffff;
      --fill-b: #67e7ff;
      --fill-c: #2195e2;
      --fill-d: #1761b8;
      --glow: rgba(97, 221, 255, .38);
      --cap: #eaffff;
      --cap-size: calc(var(--h) + 6px);
      --cap-display: block;

      position: relative;
      height: var(--h);
      padding: var(--pad);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.06)),
        linear-gradient(90deg, var(--rim-a), var(--rim-b));
      box-shadow:
        0 4px 10px rgba(2, 8, 24, .30),
        0 0 10px var(--glow);
    }

    .lite-track {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(255,255,255,.05), transparent 45%),
        linear-gradient(90deg, var(--track-a), var(--track-b));
      box-shadow: inset 0 1px 4px rgba(1, 5, 17, .46);
    }

    .lite-fill {
      position: relative;
      width: var(--value);
      height: 100%;
      overflow: hidden;
      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.08) 42%, transparent 78%),
        linear-gradient(90deg, var(--fill-a), var(--fill-b) 40%, var(--fill-c) 72%, var(--fill-d));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.38),
        0 0 8px var(--glow);
    }

    .lite-fill::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(105deg, transparent 0 36%, rgba(255,255,255,.24) 50%, transparent 64% 100%);
      transform: translateX(110%);
      opacity: .58;
      animation: liteShine 2.4s ease-in-out infinite;
      will-change: transform;
    }

    .lite-track::after {
      content: "";
      display: var(--cap-display);
      position: absolute;
      left: auto;
      right: calc(100% - var(--value));
      top: 50%;
      width: var(--cap-size);
      height: var(--cap-size);
      border-radius: 50%;
      background:
        linear-gradient(180deg, rgba(255,255,255,.42), transparent 48%),
        var(--cap);
      transform: translateY(-50%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.32),
        0 1px 4px rgba(0,0,0,.18),
        0 0 8px var(--glow);
      pointer-events: none;
      z-index: 2;
    }

    .lite-flat {
      --h: clamp(18px, 2.65vw, 29px);
      --pad: 2px;
      --cap-display: none;
      box-shadow: 0 3px 7px rgba(1, 7, 22, .22);
    }

    .lite-flat .lite-fill {
      box-shadow: none;
    }

    .lite-flat .lite-fill::before {
      display: none;
    }

    .style-1 { --cap-size:clamp(16px,2.45vw,25px); --fill-a:#f3ffff; --fill-b:#67e7ff; --fill-c:#2195e2; --fill-d:#1761b8; --rim-a:#e6fbff; --rim-b:#37c6f2; --track-a:rgba(3,25,62,.88); --track-b:rgba(10,53,102,.82); --glow:rgba(97,221,255,.38); }
    .style-2 { --radius:13px; --cap-display:none; --fill-a:#fff8bf; --fill-b:#ffd75a; --fill-c:#f69b2f; --fill-d:#c46920; --rim-a:#fff1ac; --rim-b:#d69a2d; --track-a:rgba(44,27,11,.84); --track-b:rgba(84,56,22,.78); --glow:rgba(255,198,77,.36); }
    .style-3 { --cap-size:clamp(16px,2.45vw,25px); --fill-a:#efffd9; --fill-b:#96ef69; --fill-c:#36bf70; --fill-d:#178c89; --rim-a:#def9c8; --rim-b:#43b861; --track-a:rgba(7,39,36,.84); --track-b:rgba(16,74,52,.76); --glow:rgba(112,223,98,.34); --cap:#e5ffd4; }
    .style-4 { --radius:11px; --cap-display:none; --fill-a:#fff2b8; --fill-b:#ffb249; --fill-c:#ff6b30; --fill-d:#d92757; --rim-a:#ffe4a8; --rim-b:#e2562d; --track-a:rgba(52,14,22,.84); --track-b:rgba(92,35,18,.76); --glow:rgba(255,133,56,.34); }
    .style-5 { --cap-size:clamp(17px,2.55vw,26px); --radius:16px; --fill-a:#fbebff; --fill-b:#c183ff; --fill-c:#8059ff; --fill-d:#4f69df; --rim-a:#eddcff; --rim-b:#8b61ff; --track-a:rgba(28,17,66,.86); --track-b:rgba(54,29,99,.78); --glow:rgba(173,118,255,.34); --cap:#f2e0ff; }
    .style-6 { --h:clamp(18px,2.75vw,30px); --cap-display:none; --fill-a:#fff0fa; --fill-b:#ff91d2; --fill-c:#f044a9; --fill-d:#8d55ee; --rim-a:#ffd7ee; --rim-b:#ec4aa8; --track-a:rgba(45,18,49,.84); --track-b:rgba(82,25,70,.76); --glow:rgba(255,114,192,.32); }
    .style-7 { --cap-size:clamp(15px,2.25vw,23px); --radius:9px; --fill-a:#ffe6d9; --fill-b:#ff8773; --fill-c:#f8413e; --fill-d:#b4286b; --rim-a:#ffd1c5; --rim-b:#e83b35; --track-a:rgba(50,13,18,.86); --track-b:rgba(87,22,29,.78); --glow:rgba(255,93,80,.32); --cap:#ffe9df; }
    .style-8 { --radius:18px; --cap-display:none; --fill-a:#eafff8; --fill-b:#63edd5; --fill-c:#1bb8dd; --fill-d:#237bd9; --rim-a:#d9fff5; --rim-b:#17a6d8; --track-a:rgba(5,30,58,.86); --track-b:rgba(4,67,86,.78); --glow:rgba(65,214,233,.34); }
    .style-9 { --cap-size:clamp(16px,2.45vw,25px); --radius:12px; --fill-a:#fff8ba; --fill-b:#d6ec5b; --fill-c:#6bd66a; --fill-d:#26a89a; --rim-a:#fff3a8; --rim-b:#6bc55b; --track-a:rgba(41,42,18,.84); --track-b:rgba(56,78,30,.76); --glow:rgba(217,223,88,.32); --cap:#fff0a0; }
    .style-10 { --cap-display:none; --fill-a:#e9f7ff; --fill-b:#70d8ff; --fill-c:#2d82ff; --fill-d:#7658ff; --rim-a:#ddecff; --rim-b:#4977ff; --track-a:rgba(14,22,58,.86); --track-b:rgba(21,43,96,.78); --glow:rgba(98,159,255,.34); }

    .flat-1 { --fill-a:#c9f7ff; --fill-b:#39c3ef; --fill-c:#39c3ef; --fill-d:#268dc2; --rim-a:rgba(121,220,255,.58); --rim-b:rgba(121,220,255,.34); --track-a:rgba(10,39,78,.74); --track-b:rgba(10,39,78,.74); }
    .flat-2 { --radius:10px; --fill-a:#ffe88a; --fill-b:#f0a52f; --fill-c:#f0a52f; --fill-d:#b87420; --rim-a:rgba(255,218,98,.54); --rim-b:rgba(255,218,98,.30); --track-a:rgba(56,36,14,.72); --track-b:rgba(56,36,14,.72); }
    .flat-3 { --fill-a:#d8ffa8; --fill-b:#40c66c; --fill-c:#40c66c; --fill-d:#239050; --rim-a:rgba(120,220,95,.50); --rim-b:rgba(120,220,95,.28); --track-a:rgba(15,58,43,.72); --track-b:rgba(15,58,43,.72); }
    .flat-4 { --radius:12px; --fill-a:#ffd19b; --fill-b:#ff7939; --fill-c:#ff7939; --fill-d:#bd432e; --rim-a:rgba(255,150,70,.50); --rim-b:rgba(255,150,70,.28); --track-a:rgba(68,27,20,.72); --track-b:rgba(68,27,20,.72); }
    .flat-5 { --fill-a:#dbc4ff; --fill-b:#8864ff; --fill-c:#8864ff; --fill-d:#5643bf; --rim-a:rgba(169,126,255,.50); --rim-b:rgba(169,126,255,.28); --track-a:rgba(43,27,75,.72); --track-b:rgba(43,27,75,.72); }
    .flat-6 { --radius:9px; --fill-a:#ffd1eb; --fill-b:#ef58a9; --fill-c:#ef58a9; --fill-d:#ab3f85; --rim-a:rgba(255,121,193,.48); --rim-b:rgba(255,121,193,.26); --track-a:rgba(65,25,57,.72); --track-b:rgba(65,25,57,.72); }
    .flat-7 { --fill-a:#ffc8bc; --fill-b:#ef4144; --fill-c:#ef4144; --fill-d:#a5293c; --rim-a:rgba(255,104,91,.46); --rim-b:rgba(255,104,91,.25); --track-a:rgba(63,18,27,.72); --track-b:rgba(63,18,27,.72); }
    .flat-8 { --radius:13px; --fill-a:#c8fff3; --fill-b:#21b6ca; --fill-c:#21b6ca; --fill-d:#167f99; --rim-a:rgba(83,216,220,.48); --rim-b:rgba(83,216,220,.26); --track-a:rgba(9,54,64,.72); --track-b:rgba(9,54,64,.72); }
    .flat-9 { --fill-a:#fff09a; --fill-b:#72cc58; --fill-c:#72cc58; --fill-d:#50963e; --rim-a:rgba(205,222,82,.48); --rim-b:rgba(205,222,82,.26); --track-a:rgba(47,55,22,.72); --track-b:rgba(47,55,22,.72); }
    .flat-10 { --radius:11px; --fill-a:#bfeeff; --fill-b:#4489ff; --fill-c:#4489ff; --fill-d:#d55ed4; --rim-a:rgba(102,147,255,.48); --rim-b:rgba(102,147,255,.26); --track-a:rgba(16,31,72,.72); --track-b:rgba(16,31,72,.72); }

    @keyframes liteShine {
      0%, 45% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(120%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
      }

      .stage {
        flex-direction: column;
        min-height: 100vh;
        height: 100vh;
        gap: 12px;
        padding: 12px;
      }

      .phone {
        height: min(66vh, 820px);
        max-width: 88vw;
        box-shadow:
          0 0 0 7px rgba(4, 13, 28, .96),
          0 12px 28px rgba(47, 156, 255, .10);
      }

      .phone::after {
        background: linear-gradient(0deg, rgba(214,246,255,.07), transparent 18%);
      }

      .controls {
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .pick {
        width: 42px;
        height: 18px;
      }

      .lite-bar {
        box-shadow: 0 3px 7px rgba(2, 8, 24, .26);
      }

      .lite-fill {
        box-shadow: inset 0 1px 0 rgba(255,255,255,.30);
      }

      .lite-fill::before {
        display: none;
      }
    }

  </style>
</head>
<body>
  <input class="choice" type="radio" name="bar" id="bar-1" checked>
  <input class="choice" type="radio" name="bar" id="bar-2">
  <input class="choice" type="radio" name="bar" id="bar-3">
  <input class="choice" type="radio" name="bar" id="bar-4">
  <input class="choice" type="radio" name="bar" id="bar-5">
  <input class="choice" type="radio" name="bar" id="bar-6">
  <input class="choice" type="radio" name="bar" id="bar-7">
  <input class="choice" type="radio" name="bar" id="bar-8">
  <input class="choice" type="radio" name="bar" id="bar-9">
  <input class="choice" type="radio" name="bar" id="bar-10">
  <input class="choice" type="radio" name="bar" id="bar-11">
  <input class="choice" type="radio" name="bar" id="bar-12">
  <input class="choice" type="radio" name="bar" id="bar-13">
  <input class="choice" type="radio" name="bar" id="bar-14">
  <input class="choice" type="radio" name="bar" id="bar-15">
  <input class="choice" type="radio" name="bar" id="bar-16">
  <input class="choice" type="radio" name="bar" id="bar-17">
  <input class="choice" type="radio" name="bar" id="bar-18">
  <input class="choice" type="radio" name="bar" id="bar-19">
  <input class="choice" type="radio" name="bar" id="bar-20">

  <main class="stage">
    <section class="phone">
      <img class="loading-art" src="loading.png" alt="">
      <div class="bars">
        <div class="bar variant-1">
          <div class="lite-bar style-1"><div class="lite-track"><div class="lite-fill"></div></div></div>
        </div>

        <div class="bar variant-2">
          <div class="lite-bar style-2"><div class="lite-track"><div class="lite-fill"></div></div></div>
        </div>

        <div class="bar variant-3">
