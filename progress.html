<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading Bar Preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --screen-w: min(42vw, 414px);
      --ice: #aef8ff;
      --ice-2: #63d8ff;
      --deep: #102b66;
      --navy: #071a42;
      --gold: #ffe184;
      --gold-2: #c3912c;
      --value: 68%;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .choice {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
      width: 100vw;
      height: 100vh;
      padding: 24px;
    }

    .phone {
      position: relative;
      width: auto;
      height: min(92vh, 920px);
      max-width: calc(100vw - 168px);
      aspect-ratio: 920 / 2048;
      overflow: hidden;
      border-radius: clamp(22px, 3vw, 38px);
      background: #0b1e4a;
      box-shadow:
        0 0 0 2px rgba(168, 238, 255, .22),
        0 0 0 10px rgba(4, 13, 28, .96),
        0 32px 90px rgba(47, 156, 255, .24);
      isolation: isolate;
    }

    .phone::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow:
        inset 0 0 80px rgba(19, 38, 88, .36),
        inset 0 -110px 120px rgba(214, 246, 255, .16);
      pointer-events: none;
      z-index: 2;
    }

    .loading-art {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .bars {
      position: absolute;
      left: 9.5%;
      right: 9.5%;
      bottom: 7.1%;
      height: 7%;
      z-index: 3;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .bar {
      position: absolute;
      width: 100%;
      opacity: 0;
      transform: translateY(12px) scale(.96);
      transition: opacity .24s ease, transform .24s ease;
    }

    #bar-1:checked ~ .stage .variant-1,
    #bar-2:checked ~ .stage .variant-2,
    #bar-3:checked ~ .stage .variant-3,
    #bar-4:checked ~ .stage .variant-4,
    #bar-5:checked ~ .stage .variant-5,
    #bar-6:checked ~ .stage .variant-6,
    #bar-7:checked ~ .stage .variant-7,
    #bar-8:checked ~ .stage .variant-8,
    #bar-9:checked ~ .stage .variant-9,
    #bar-10:checked ~ .stage .variant-10,
    #bar-11:checked ~ .stage .variant-11,
    #bar-12:checked ~ .stage .variant-12,
    #bar-13:checked ~ .stage .variant-13,
    #bar-14:checked ~ .stage .variant-14,
    #bar-15:checked ~ .stage .variant-15,
    #bar-16:checked ~ .stage .variant-16,
    #bar-17:checked ~ .stage .variant-17,
    #bar-18:checked ~ .stage .variant-18,
    #bar-19:checked ~ .stage .variant-19,
    #bar-20:checked ~ .stage .variant-20 {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .controls {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
      z-index: 5;
    }

    .pick {
      position: relative;
      width: 46px;
      height: 20px;
      border: 1px solid rgba(159, 232, 255, .25);
      border-radius: 999px;
      background: rgba(8, 25, 56, .78);
      cursor: pointer;
      box-shadow: inset 0 0 14px rgba(99, 216, 255, .1);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .pick::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 50%;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ice), var(--ice-2) 64%, rgba(255, 255, 255, .18) 64%);
      transform: translateY(-50%);
      box-shadow: 0 0 10px rgba(120, 225, 255, .36);
    }

    .pick::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 31px;
      width: 9px;
      height: 9px;
      background: #e8fdff;
      transform: translateY(-50%) rotate(45deg);
      box-shadow: 0 0 12px rgba(161, 244, 255, .9);
    }

    .pick:hover {
      transform: translateX(-2px);
      border-color: rgba(220, 250, 255, .7);
    }

    #bar-1:checked ~ .stage label[for="bar-1"],
    #bar-2:checked ~ .stage label[for="bar-2"],
    #bar-3:checked ~ .stage label[for="bar-3"],
    #bar-4:checked ~ .stage label[for="bar-4"],
    #bar-5:checked ~ .stage label[for="bar-5"],
    #bar-6:checked ~ .stage label[for="bar-6"],
    #bar-7:checked ~ .stage label[for="bar-7"],
    #bar-8:checked ~ .stage label[for="bar-8"],
    #bar-9:checked ~ .stage label[for="bar-9"],
    #bar-10:checked ~ .stage label[for="bar-10"],
    #bar-11:checked ~ .stage label[for="bar-11"],
    #bar-12:checked ~ .stage label[for="bar-12"],
    #bar-13:checked ~ .stage label[for="bar-13"],
    #bar-14:checked ~ .stage label[for="bar-14"],
    #bar-15:checked ~ .stage label[for="bar-15"],
    #bar-16:checked ~ .stage label[for="bar-16"],
    #bar-17:checked ~ .stage label[for="bar-17"],
    #bar-18:checked ~ .stage label[for="bar-18"],
    #bar-19:checked ~ .stage label[for="bar-19"],
    #bar-20:checked ~ .stage label[for="bar-20"] {
      border-color: rgba(255, 235, 150, .95);
      box-shadow:
        inset 0 0 14px rgba(255, 225, 132, .18),
        0 0 22px rgba(255, 219, 106, .34);
    }

    .pick:nth-child(2)::before {
      height: 8px;
      border: 1px solid rgba(255, 225, 132, .78);
      background: linear-gradient(90deg, #fef7b9, #5edbff 66%, rgba(255, 255, 255, .12) 66%);
    }

    .pick:nth-child(3)::before {
      height: 12px;
      border-radius: 2px;
      background:
        repeating-linear-gradient(90deg, var(--ice) 0 4px, transparent 4px 7px),
        linear-gradient(90deg, transparent 68%, rgba(255, 255, 255, .14) 68%);
    }

    .pick:nth-child(4)::before {
      height: 10px;
      clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, .5) 0 4px, transparent 4px 8px),
        linear-gradient(90deg, #77ebff 0 68%, rgba(255, 255, 255, .13) 68%);
    }

    .pick:nth-child(5)::before {
      height: 2px;
      background: linear-gradient(90deg, transparent, #e8fdff 68%, rgba(255, 255, 255, .2) 68%);
    }

    .pick:nth-child(6)::before {
      height: 12px;
      background:
        radial-gradient(circle at 17% 50%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 45% 50%, #fff 0 2px, transparent 3px),
        linear-gradient(90deg, #86f0ff 68%, rgba(255, 255, 255, .13) 68%);
    }

    .pick:nth-child(7)::before {
      height: 12px;
      background:
        linear-gradient(#aef8ff 0 3px, transparent 3px 9px, #aef8ff 9px 12px),
        linear-gradient(90deg, transparent 68%, rgba(255, 255, 255, .15) 68%);
    }

    .pick:nth-child(8)::before {
      height: 10px;
      border-radius: 1px;
      background:
        repeating-linear-gradient(90deg, #ddfcff 0 6px, #4dcaff 6px 10px, transparent 10px 13px),
        linear-gradient(90deg, transparent 68%, rgba(255, 255, 255, .15) 68%);
    }

    .pick:nth-child(9)::before {
      height: 11px;
      border: 1px solid rgba(120, 225, 255, .9);
      background: linear-gradient(90deg, #dfffff 0 16%, #67dfff 16% 68%, rgba(255, 255, 255, .14) 68%);
      clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0 50%);
    }

    .pick:nth-child(10)::before {
      height: 9px;
      border-radius: 2px;
      background:
        radial-gradient(circle at 12% 50%, #ffe184 0 3px, transparent 4px),
        radial-gradient(circle at 46% 50%, #e8fdff 0 3px, transparent 4px),
        linear-gradient(90deg, #69e6ff 68%, rgba(255, 255, 255, .13) 68%);
    }

    .crystal-shell {
      position: relative;
      height: clamp(30px, 4.6vw, 50px);
      padding: 6px;
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .78), rgba(107, 219, 255, .14) 38%, rgba(4, 18, 58, .84) 39%),
        linear-gradient(90deg, #efffff, #2697d1);
      box-shadow:
        0 10px 28px rgba(4, 14, 40, .42),
        0 0 26px rgba(102, 224, 255, .38);
    }

    .crystal-track {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: inherit;
      background: rgba(8, 27, 66, .78);
      box-shadow: inset 0 5px 14px rgba(1, 7, 22, .62);
    }

    .crystal-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--value);
      border-radius: inherit;
      background:
        linear-gradient(110deg, transparent 0 12%, rgba(255, 255, 255, .8) 18%, transparent 25% 42%, rgba(255, 255, 255, .45) 49%, transparent 56%),
        linear-gradient(180deg, #efffff 0%, #79eaff 36%, #1d91db 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .9),
        0 0 24px rgba(96, 222, 255, .85);
      animation: glint 2.6s linear infinite;
    }

    .crystal-gem {
      position: absolute;
      top: 50%;
      left: calc(var(--value) - 16px);
      width: clamp(24px, 3.9vw, 42px);
      height: clamp(24px, 3.9vw, 42px);
      border: 2px solid #f2ffff;
      background: linear-gradient(135deg, #ffffff 0 18%, #8df3ff 19% 52%, #2c8fce 53% 100%);
      transform: translateY(-50%) rotate(45deg);
      box-shadow: 0 0 22px rgba(167, 247, 255, .9);
    }

    .gold-frame {
      position: relative;
      height: clamp(30px, 4.7vw, 52px);
      padding: 5px;
      border-radius: 999px;
      background:
        linear-gradient(180deg, #fff7be, #d49f35 46%, #6c4513 47%, #ffd96a);
      box-shadow: 0 10px 26px rgba(7, 12, 34, .45);
    }

    .gold-frame::before,
    .gold-frame::after {
      content: "";
      position: absolute;
      top: 50%;
      width: clamp(21px, 3.7vw, 40px);
      height: clamp(21px, 3.7vw, 40px);
      background: linear-gradient(135deg, #fff7be, #d58e23);
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      transform: translateY(-50%);
      filter: drop-shadow(0 0 8px rgba(255, 226, 124, .72));
    }

    .gold-frame::before {
      left: -12px;
    }

    .gold-frame::after {
      right: -12px;
    }

    .gold-track {
      height: 100%;
      overflow: hidden;
      border-radius: inherit;
      background: #0c265c;
      box-shadow: inset 0 4px 14px rgba(0, 5, 20, .58);
    }

    .gold-fill {
      width: var(--value);
      height: 100%;
      border-radius: inherit;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, .45) 0 2px, transparent 2px 18px),
        linear-gradient(180deg, #fbffff, #7cecff 43%, #217ed0);
      box-shadow: 0 0 23px rgba(105, 228, 255, .72);
      animation: shimmer 1.9s linear infinite;
    }

    .rune-row {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: clamp(3px, .8vw, 8px);
      height: clamp(28px, 4.2vw, 46px);
      padding: 4px clamp(6px, 1.4vw, 12px);
      border-radius: 999px;
      background: rgba(5, 18, 48, .68);
      border: 1px solid rgba(186, 244, 255, .42);
      box-shadow: 0 0 20px rgba(112, 224, 255, .28), inset 0 0 20px rgba(8, 40, 87, .72);
    }

    .rune-row i {
      display: block;
      height: 100%;
      min-width: 0;
      background: rgba(130, 195, 220, .16);
      clip-path: polygon(50% 0, 100% 27%, 78% 100%, 22% 100%, 0 27%);
      box-shadow: inset 0 0 0 1px rgba(239, 255, 255, .2);
    }

    .rune-row i:nth-child(-n + 8) {
      background: linear-gradient(180deg, #f5ffff, #7df0ff 52%, #267fca);
      box-shadow: 0 0 14px rgba(126, 238, 255, .72), inset 0 1px 0 rgba(255, 255, 255, .8);
      animation: pulse 2.2s ease-in-out infinite;
    }

    .shard-shell {
      position: relative;
      height: clamp(28px, 4.4vw, 48px);
      padding: 4px;
      background: linear-gradient(135deg, rgba(235, 254, 255, .95), rgba(39, 135, 209, .38));
      clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
      box-shadow: 0 0 24px rgba(106, 232, 255, .36);
    }

    .shard-track {
      position: relative;
      height: 100%;
      overflow: hidden;
      background: rgba(7, 24, 61, .84);
      clip-path: inherit;
    }

    .shard-fill {
      width: var(--value);
      height: 100%;
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, .7) 0 9px, transparent 9px 18px),
        linear-gradient(90deg, #e8ffff, #42d7ff 58%, #2676c5);
      box-shadow: 0 0 20px rgba(109, 230, 255, .72);
      animation: shardSlide 1.4s linear infinite;
    }

    .line-magic {
      position: relative;
      height: clamp(30px, 4.4vw, 48px);
    }

    .line-magic::before {
      content: "";
      position: absolute;
      left: 2%;
      right: 2%;
      top: 50%;
      height: 3px;
      border-radius: 999px;
      background: rgba(196, 243, 255, .18);
      box-shadow: 0 0 18px rgba(139, 230, 255, .32);
    }

    .line-magic::after {
      content: "";
      position: absolute;
      left: 2%;
      top: 50%;
      width: calc(var(--value) - 4%);
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #e8feff 18%, #5fe2ff);
      box-shadow: 0 0 22px rgba(136, 237, 255, .9);
    }

    .line-orb {
      position: absolute;
      left: var(--value);
      top: 50%;
      width: clamp(20px, 3.2vw, 34px);
      height: clamp(20px, 3.2vw, 34px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 35%, #fff 0 12%, #b5fbff 13% 36%, #2795d7 58%, rgba(32, 109, 190, .12) 61%);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 24px rgba(145, 239, 255, .92);
      animation: float 2s ease-in-out infinite;
    }

    .snow-glass {
      height: clamp(34px, 5vw, 54px);
      padding: 6px;
      border-radius: 13px;
      background: rgba(214, 247, 255, .24);
      border: 1px solid rgba(245, 254, 255, .55);
      box-shadow: 0 12px 28px rgba(0, 11, 34, .45), inset 0 0 22px rgba(255, 255, 255, .16);
      backdrop-filter: blur(2px);
    }

    .snow-track {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 9px;
      background: rgba(8, 28, 67, .72);
    }

    .snow-fill {
      width: var(--value);
      height: 100%;
      border-radius: inherit;
      background:
        radial-gradient(circle at 12% 42%, rgba(255, 255, 255, .95) 0 2px, transparent 3px),
        radial-gradient(circle at 28% 65%, rgba(255, 255, 255, .8) 0 1px, transparent 2px),
        radial-gradient(circle at 49% 35%, rgba(255, 255, 255, .85) 0 2px, transparent 3px),
        radial-gradient(circle at 72% 60%, rgba(255, 255, 255, .75) 0 1px, transparent 2px),
        linear-gradient(180deg, #f5ffff, #76e6ff 58%, #2b7bc1);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, auto;
      box-shadow: 0 0 22px rgba(105, 224, 255, .74);
    }

    .twin {
      position: relative;
      height: clamp(36px, 5vw, 58px);
      filter: drop-shadow(0 0 18px rgba(106, 224, 255, .34));
    }

    .twin::before,
    .twin::after {
      content: "";
      position: absolute;
      left: 0;
      width: 100%;
      height: 9px;
      border-radius: 999px;
      background: rgba(8, 24, 58, .76);
      border: 1px solid rgba(191, 245, 255, .42);
      box-shadow: inset 0 0 10px rgba(1, 8, 27, .84);
    }

    .twin::before {
      top: 8px;
    }

    .twin::after {
      bottom: 8px;
    }

    .twin span {
      position: absolute;
      left: 0;
      width: var(--value);
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, #fff, #74ecff, #2b86d1);
      box-shadow: 0 0 18px rgba(117, 235, 255, .8);
    }

    .twin span:first-child {
      top: 8px;
    }

    .twin span:last-child {
      bottom: 8px;
    }

    .twin-gem {
      position: absolute;
      left: var(--value);
      top: 50%;
      width: clamp(24px, 4vw, 42px);
      height: clamp(24px, 4vw, 42px);
      border: 2px solid rgba(245, 255, 255, .92);
      background: linear-gradient(135deg, #fff, #70e8ff 45%, #236fb7);
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      transform: translate(-50%, -50%);
    }

    .block-ice {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      gap: clamp(3px, .75vw, 7px);
      height: clamp(30px, 4.8vw, 52px);
      padding: 4px;
      border-radius: 8px;
      background: rgba(4, 17, 47, .6);
      border: 1px solid rgba(191, 245, 255, .38);
      box-shadow: 0 0 20px rgba(90, 214, 255, .24);
    }

    .block-ice i {
      display: block;
      min-width: 0;
      border-radius: 3px;
      background: rgba(138, 203, 230, .12);
      transform: skewX(-10deg);
    }

    .block-ice i:nth-child(-n + 8) {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .85) 0 18%, transparent 19%),
        linear-gradient(180deg, #dfffff, #64dcff 53%, #226fb5);
      box-shadow: 0 0 12px rgba(106, 229, 255, .62);
    }

    .hex {
      position: relative;
      height: clamp(32px, 4.8vw, 54px);
      padding: 5px;
      clip-path: polygon(6% 0, 94% 0, 100% 50%, 94% 100%, 6% 100%, 0 50%);
      background: linear-gradient(180deg, rgba(242, 255, 255, .88), rgba(76, 190, 239, .22) 45%, rgba(7, 26, 64, .92) 46%);
      box-shadow: 0 0 24px rgba(100, 219, 255, .34);
    }

    .hex-track {
      height: 100%;
      overflow: hidden;
      clip-path: inherit;
      background: rgba(7, 24, 62, .88);
    }

    .hex-fill {
      position: relative;
      width: var(--value);
      height: 100%;
      background: linear-gradient(90deg, #f7ffff, #80edff 48%, #347fca);
      box-shadow: 0 0 19px rgba(113, 229, 255, .77);
    }

    .hex-fill::after {
      content: "";
      position: absolute;
      inset: 18% 10%;
      background: linear-gradient(90deg, rgba(255, 255, 255, .8), transparent);
      opacity: .74;
    }

    .bead {
      position: relative;
      height: clamp(34px, 5vw, 56px);
      border-radius: 999px;
      border: 1px solid rgba(184, 244, 255, .48);
      background: rgba(4, 18, 49, .66);
      box-shadow: inset 0 0 22px rgba(5, 40, 84, .82), 0 0 20px rgba(101, 221, 255, .28);
    }

    .bead::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 50%;
      width: calc(var(--value) - 5px);
      height: 42%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffffff, #7befff, #2f88ce);
      transform: translateY(-50%);
      box-shadow: 0 0 20px rgba(118, 235, 255, .82);
    }

    .bead i {
      position: absolute;
      top: 50%;
      width: clamp(13px, 2.2vw, 24px);
      height: clamp(13px, 2.2vw, 24px);
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff, #6ee8ff 56%, #226fb9);
      box-shadow: 0 0 15px rgba(122, 234, 255, .8);
      transform: translate(-50%, -50%);
    }

    .bead i:nth-child(1) {
      left: 14%;
    }

    .bead i:nth-child(2) {
      left: 34%;
    }

    .bead i:nth-child(3) {
      left: 54%;
    }

    .bead i:nth-child(4) {
      left: 68%;
      background: linear-gradient(135deg, #fff8bf, #f1b936 56%, #9a6517);
      box-shadow: 0 0 16px rgba(255, 220, 96, .76);
    }

    .sigil {
      position: relative;
      height: clamp(36px, 5.2vw, 58px);
      padding: 4px 16px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255, 228, 138, .84), rgba(107, 73, 24, .58));
      clip-path: polygon(5% 0, 95% 0, 100% 50%, 95% 100%, 5% 100%, 0 50%);
      box-shadow: 0 10px 27px rgba(0, 12, 35, .46), 0 0 17px rgba(255, 217, 96, .32);
    }

    .sigil-track {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(7, 23, 57, .86);
      clip-path: inherit;
    }

    .sigil-fill {
      width: var(--value);
      height: 100%;
      background:
        radial-gradient(circle at 12% 50%, rgba(255, 244, 178, .96) 0 6px, transparent 7px),
        radial-gradient(circle at 48% 50%, rgba(232, 253, 255, .96) 0 5px, transparent 6px),
        linear-gradient(90deg, #fcffff, #6ee8ff 58%, #2b79c0);
      box-shadow: 0 0 20px rgba(107, 227, 255, .72);
    }

    @keyframes glint {
      from {
        background-position: -150px 0, 0 0;
      }

      to {
        background-position: 180px 0, 0 0;
      }
    }

    @keyframes shimmer {
      from {
        background-position: 0 0, 0 0;
      }

      to {
        background-position: 22px 0, 0 0;
      }
    }

    @keyframes shardSlide {
      from {
        background-position: 0 0, 0 0;
      }

      to {

      --marker-border: rgba(255, 255, 255, .48);
      position: relative;
      height: var(--bar-h, clamp(20px, 3.1vw, 34px));
      padding: var(--bar-padding);

        linear-gradient(180deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .08)),

      inset: -2px;
      border-radius: inherit;

      opacity: .55;
      pointer-events: none;

    .smooth-track {
      position: relative;
      height: 100%;

      background:

    .smooth-fill {
      position: relative;
      width: var(--value);

      border-radius: inherit;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .36), rgba(255, 255, 255, .08) 38%, transparent 74%),

      background: var(--marker-bg);
