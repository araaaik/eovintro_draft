<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animation preview</title>
  <link rel="stylesheet" href="logo-animation.css">
  <style>
    :root {
      color-scheme: light dark;
      --page-bg: #747c86;
      --frame-border: rgba(255, 255, 255, .55);
      --frame-shadow: rgba(22, 28, 36, .32);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(20px, 4vw, 56px);
      background: var(--page-bg);
      font-family: Arial, sans-serif;
    }

    .preview {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(48px, 9vw, 120px);
      width: min(100%, 1040px);
    }

    .frame {
      position: relative;
      display: grid;
      place-items: center;
      width: min(40vw, 320px);
      min-width: 150px;
      aspect-ratio: 1 / 2;
      border: 1px solid var(--frame-border);
      box-shadow: 0 18px 42px var(--frame-shadow);
      overflow: hidden;
    }

    .frame--black {
      background: #000;
    }

    .frame--white {
      background: #fff;
    }

    .frame .logo-animation {
      --logo-width: min(64%, 205px);
    }

    .loading-note {
      position: absolute;
      left: 50%;
      bottom: 6.4%;
      width: 82%;
      transform: translateX(-50%);
      font-weight: 700;
      font-style: italic;
      font-family: Arial, sans-serif;
      pointer-events: none;
    }

    .loading-message {
      width: auto;
      min-height: 0;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      font-size: clamp(11px, 1.8vw, 16px);
      font-style: normal;
      line-height: 1.12;
      text-align: center;
      text-shadow: none;
      box-shadow: none;
    }

    .frame--black .loading-message {
      color: #ffffff;
    }

    .frame--white .loading-message {
      color: #f5952c;
    }

    @media (max-width: 520px) {
      body {
        align-items: start;
      }

      .preview {
        flex-direction: column;
      }

      .frame {
        width: min(72vw, 260px);
      }

      .loading-message {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="preview" aria-label="Animation preview on black and white backgrounds">
    <section class="frame frame--black" aria-label="Black frame">
      <div class="logo-animation">
        <img src="logo.svg" alt="Gamebion logo" decoding="async">
        <div class="logo-shine">
          <div class="shine-window">
            <img src="logo.svg" alt="" aria-hidden="true" decoding="async">
          </div>
        </div>
      </div>
      <div class="loading-note" aria-hidden="true">
        <div class="loading-message">First loading<br>may take longer</div>
      </div>
    </section>

    <section class="frame frame--white" aria-label="White frame">
      <div class="logo-animation">
        <img src="logo.svg" alt="Gamebion logo" decoding="async">
        <div class="logo-shine">
          <div class="shine-window">
            <img src="logo.svg" alt="" aria-hidden="true" decoding="async">
          </div>
        </div>
      </div>
      <div class="loading-note" aria-hidden="true">
        <div class="loading-message">First loading<br>may take longer</div>
      </div>
    </section>
  </main>
</body>
</html>
